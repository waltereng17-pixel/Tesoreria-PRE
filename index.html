<style>
/* Libro de caja del grupo: banda azul de tapa de cuaderno con el sol amarillo del sábado; cada sector (cajas, mes, categorías, eventos) con su propio color para leerse de un vistazo. */
:root{
  --bg:#F2F4F9; --paper:#FFFFFF; --ink:#172033; --ink-2:#48546A; --ink-3:#77829A;
  --line:#DCE1EA; --line-2:#EDF0F5;
  --band:#1D3B8B; --band-2:#2A4FAE; --band-ink:#FFFFFF; --band-ink-2:#C9D6F5; --sun:#F4C542;
  --in:#2F5FC8; --out:#D27A22;
  --c0:#8A94A6; --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --c7:#6250d6; --c8:#e34948;
  --warn:#B4541A; --ok:#1F7A52;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:14px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0F131B; --paper:#18202B; --ink:#E8ECF2; --ink-2:#AEB8C8; --ink-3:#7F8A9E;
  --line:#2B3442; --line-2:#212936;
  --band:#152C68; --band-2:#1E3C86; --band-ink:#FFFFFF; --band-ink-2:#B4C4EE; --sun:#E3B536;
  --in:#5A82DC; --out:#C97A2E;
  --c0:#8792A6; --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#2E9B2E; --c7:#9085e9; --c8:#e66767;
  --warn:#E39A62; --ok:#6CC79A; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font:15px/1.45 var(--f-body);padding-bottom:env(safe-area-inset-bottom,0px)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
.gut{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* banda superior */
.band{background:var(--band);color:var(--band-ink);padding-top:env(safe-area-inset-top,0px)}
.band .gut{padding-block:18px 0;display:flex;flex-direction:column;gap:14px}
.band-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.band .eyebrow{color:var(--sun)}
.band h1{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.band p{margin:4px 0 0;color:var(--band-ink-2);font-size:14px}
.acct{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.12);color:var(--band-ink);white-space:nowrap;border:0}
.pill.sun{background:var(--sun);color:#1b1b1b}
button.pill{cursor:pointer;font-family:var(--f-body)}
button.pill:hover{background:rgba(255,255,255,.22)}
.eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--ink-3)}
nav.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:12px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{--k:var(--c1);display:inline-flex;align-items:center;gap:7px;font:600 14px var(--f-body);color:var(--band-ink-2);background:rgba(255,255,255,.08);border:0;padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
nav.tabs button i{width:9px;height:9px;border-radius:50%;background:var(--k);display:inline-block}
nav.tabs button[aria-selected="true"]{background:var(--paper);color:var(--ink)}
main{padding-block:18px 56px;display:flex;flex-direction:column;gap:22px}
:focus-visible{outline:2.5px solid var(--c1);outline-offset:2px}
button,select,input{font-family:var(--f-body)}
/* tarjetas de color por sector */
.k{--k:var(--c0)}
.tile{background:color-mix(in srgb,var(--k) 11%,var(--paper));border:1px solid color-mix(in srgb,var(--k) 32%,var(--line));border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:3px;min-width:0;position:relative}
.tile .lab{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink-2)}
.ico{width:26px;height:26px;border-radius:8px;background:var(--k);color:#fff;display:inline-grid;place-items:center;font:700 13px var(--f-body);flex:none}
.tile .val{font-size:22px;font-weight:600}
.tile small{color:var(--ink-3);font-size:12px}
.cajas{display:grid;grid-template-columns:1.25fr 1fr 1fr;grid-template-rows:auto auto;gap:10px}
.cajas .main{grid-row:1/3;justify-content:space-between}
.cajas .main .val{font-size:38px;line-height:1.05}
@media (max-width:600px){.cajas{grid-template-columns:1fr}.cajas .main{grid-row:auto}.cajas .tile:not(.main){flex-direction:row;justify-content:space-between;align-items:center;gap:10px}.cajas .tile:not(.main) .val{font-size:18px;white-space:nowrap}}
.mes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:600px){.mes{grid-template-columns:1fr 1fr}}
.mes .val{font-size:18px}
.sec{display:flex;flex-direction:column;gap:12px}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sec-head h2{font-size:19px;font-weight:700;display:flex;align-items:center;gap:9px}
.sec-head h2 .ico{width:24px;height:24px;font-size:12px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
/* barra por categoría */
.stack{display:flex;height:22px;border-radius:6px;overflow:hidden;gap:2px;background:var(--paper)}
.stack i{display:block;height:100%;background:var(--k);min-width:3px}
.stack i:first-child{border-radius:6px 0 0 6px}.stack i:last-child{border-radius:0 6px 6px 0}
.leg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px 16px}
.leg div{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:center;font-size:13.5px;min-width:0}
.leg div > i{width:12px;height:12px;border-radius:3px;background:var(--k)}
.leg span:nth-child(2){min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leg .num{font-size:13px;color:var(--ink-2)}
/* carga rápida */
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.qbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:11px 13px;border-radius:12px;border:1px solid color-mix(in srgb,var(--k) 40%,var(--line));background:color-mix(in srgb,var(--k) 12%,var(--paper));color:var(--ink);cursor:pointer;text-align:left;min-width:0;font:inherit}
.qbtn:hover{border-color:var(--k)}
.qbtn b{font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:7px}
.qbtn b i{width:10px;height:10px;border-radius:50%;background:var(--k)}
.qbtn span{font-size:13px;color:var(--ink-2)}
.qbtn.new{border-style:dashed;background:var(--paper);justify-content:center}
.form{background:var(--paper);border:2px solid var(--c1);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;background:var(--bg);flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--ink-2);min-width:0}
label.f input,label.f select,.filters select,.filters input,select.plain{font-size:15px;font-weight:400;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 10px;width:100%;min-width:0}
select.plain{width:auto}
label.f input.monto{font-family:var(--f-num);font-size:20px;font-weight:600}
.datebtns{display:flex;gap:6px;flex-wrap:wrap}
.datebtns button{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink-2);cursor:pointer}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font:600 14px var(--f-body);padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--band);border-color:var(--band);color:#fff}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn.small{padding:6px 11px;font-size:13px}
/* lista de movimientos */
.list{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.day{display:flex;justify-content:space-between;gap:10px;padding:8px 14px;background:var(--line-2);font-size:12.5px;font-weight:700;color:var(--ink-2);align-items:center}
.day.sab{background:color-mix(in srgb,var(--sun) 22%,var(--paper));color:var(--ink)}
.day .tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;background:var(--sun);color:#1b1b1b;padding:1px 7px;border-radius:999px;margin-left:8px}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;padding:10px 14px;border-top:1px solid var(--line-2);align-items:center}
.day + .row{border-top:0}
.row.edit{cursor:pointer}
.row.edit:hover{background:var(--bg)}
.row .ico{grid-column:1;grid-row:1/3;align-self:start;margin-top:2px}
.row .d{grid-column:2;grid-row:1;font-weight:600;min-width:0;overflow-wrap:anywhere}
.row .meta{grid-column:2/3;grid-row:2;font-size:12.5px;color:var(--ink-3);display:flex;gap:4px 10px;flex-wrap:wrap}
.row .amt{grid-column:3;grid-row:1/3;align-self:start;font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:600;font-size:15px;text-align:right;white-space:nowrap}
.amt.in{color:var(--ink)}.amt.out{color:var(--ink)}
.sign{display:inline-block;width:20px;height:20px;border-radius:6px;margin-right:6px;text-align:center;line-height:20px;font-size:13px;vertical-align:1px;color:#fff}
.sign.in{background:var(--in)}.sign.out{background:var(--out)}.sign.aj{background:var(--c0)}.sign.cb{background:var(--c6)}
.row .nota{grid-column:2/-1;font-size:12.5px;color:var(--ink-2);background:var(--bg);border-radius:6px;padding:4px 8px;margin-top:4px}
.empty{padding:28px 16px;text-align:center;color:var(--ink-3)}
.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:600px){.filters{grid-template-columns:1fr 1fr}}
.filters .search{grid-column:1/-1}
.totbar{display:flex;gap:8px;flex-wrap:wrap}
.totbar .tile{padding:8px 12px;flex-direction:row;align-items:baseline;gap:8px;font-size:13px}
.totbar .tile b{font-family:var(--f-num);font-weight:600}
/* gráficos */
.chart-box{position:relative;overflow-x:auto}
.chart-box svg{display:block;width:100%;height:auto;min-width:520px}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--ink-2);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);font-size:12.5px;padding:6px 9px;border-radius:7px;white-space:nowrap;z-index:3;transform:translate(-50%,-110%)}
.catrow{display:grid;grid-template-columns:minmax(0,11em) 1fr 9.5em;gap:10px;align-items:center;font-size:13.5px}
.catrow > span:first-child{display:flex;align-items:center;gap:8px;min-width:0}
.catrow > span:first-child i{width:10px;height:10px;border-radius:3px;background:var(--k);flex:none}
.catrow .bar{height:12px;background:var(--line-2);border-radius:4px;overflow:hidden}
.catrow .bar i{display:block;height:100%;background:var(--k);border-radius:0 4px 4px 0}
.catrow .num{font-size:13px;text-align:right}
@media (max-width:480px){.catrow{grid-template-columns:minmax(0,8em) 1fr 7.5em}}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{padding:6px 8px;border-top:1px solid var(--line-2);text-align:right;white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t th{color:var(--ink-3);font-weight:600;border-top:0}
.tscroll{overflow-x:auto}
details.ev{background:var(--paper);border:1px solid var(--line);border-top:5px solid var(--k);border-radius:var(--r);overflow:hidden}
details.ev summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
details.ev summary::-webkit-details-marker{display:none}
.evhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.evhead b{font-family:var(--f-display);font-size:17px}
.evhead small{color:var(--ink-3);font-size:12.5px}
.evnums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.evnums .tile{padding:8px 10px}.evnums .val{font-size:15px}
details.ev .list{border:0;border-top:1px solid var(--line);border-radius:0}
.note{font-size:13.5px;color:var(--ink-2);margin:0;max-width:64ch}
.confirm{background:color-mix(in srgb,var(--c4) 18%,var(--paper));border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13.5px}
.atj{display:grid;grid-template-columns:1.4fr 1fr 1fr auto;gap:8px;align-items:end}
@media (max-width:600px){.atj{grid-template-columns:1fr 1fr}}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;font-size:13.5px;font-weight:600;z-index:20;max-width:90vw}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.act{background:var(--paper);border:1px solid var(--line);border-top:5px solid var(--k);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;font:inherit;color:var(--ink);min-width:0}
.act:hover{border-color:var(--k)}
.act .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.act b{font-family:var(--f-display);font-size:16.5px}
.act small{color:var(--ink-3);font-size:12.5px}
.act .nums{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13.5px}
.act .nums span:nth-child(even){text-align:right;font-family:var(--f-num)}
.bal{font-weight:700}
.bal.pos{color:var(--ok)}.bal.neg{color:var(--warn)}
.badge{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--k) 18%,var(--paper));color:var(--ink);white-space:nowrap}
.badge.curso{background:color-mix(in srgb,var(--c4) 28%,var(--paper))}
.mrow{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line-2);font-size:14px}
.mrow .num{text-align:right;min-width:7.5em}
.mrow.head{font-size:12px;color:var(--ink-3);font-weight:700;border-top:0;padding-top:0}
@media (max-width:520px){.mrow{grid-template-columns:1fr auto auto}.mrow .hide-s{display:none}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.two{grid-template-columns:1fr}}
.irow{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;padding:9px 12px;border-top:1px solid var(--line-2);align-items:center}
.irow:first-child{border-top:0}
.irow.edit{cursor:pointer}.irow.edit:hover{background:var(--bg)}
.irow .d{font-weight:600;min-width:0;overflow-wrap:anywhere}
.irow .meta{grid-column:2/3;font-size:12.5px;color:var(--ink-3)}
.irow .num{grid-column:3;grid-row:1/3;font-weight:600;white-space:nowrap}
.irow .ico{grid-row:1/3}
.back{display:inline-flex;align-items:center;gap:6px;font:600 14px var(--f-body);color:var(--ink-2);background:none;border:0;padding:0;cursor:pointer}
.loading{padding:40px 0;color:var(--ink-3);text-align:center}
code.rules{display:block;white-space:pre;overflow-x:auto;font:12.5px/1.5 var(--f-num);background:var(--bg);border-radius:8px;padding:10px}
@media (prefers-reduced-motion: no-preference){.form{animation:in .18s ease-out}@keyframes in{from{transform:translateY(4px);opacity:.6}}}
</style>
</head>

  if (!canWrite) return;
  saveState = "saving"; renderEstado();
  const datos = JSON.parse(JSON.stringify(S));
  try {
    await LIBRO.set(Object.assign(datos, {actualizado: firebase.firestore.FieldValue.serverTimestamp(), por: usuario.email}));
    // una copia por día con el estado del momento
    const dia = hoy();
    if (ultimaCopia !== dia){
      await COPIAS.doc(dia).set({libro: JSON.stringify(S), movs: S.movs.length, guardado: firebase.firestore.FieldValue.serverTimestamp()});
      ultimaCopia = dia; copias = null;
    }
    saveState = "ok";
  } catch(e){
    saveState = "error";
    toast(e && e.code === "permission-denied" ? "Firebase no te dejó guardar: revisá las reglas de Firestore" : "No se pudo guardar. Reintento en unos segundos.");
    if (!(e && e.code === "permission-denied")){ clearTimeout(saveTimer); saveTimer = setTimeout(guardar, 5000); }
  }
  renderEstado();
}

function filaMov(m, edit){
  const c = caja(m.caja);
  let amt, sg;
  if (m.t === "in"){ amt = fmt(m.m, c.moneda); sg = '<span class="sign in">+</span>'; }
  else if (m.t === "out"){ amt = fmt(m.m, c.moneda); sg = '<span class="sign out">−</span>'; }
  else if (m.t === "ajuste"){ amt = fmt(m.m, c.moneda); sg = '<span class="sign aj">±</span>'; }
  else { amt = fmt(m.m, c.moneda) + " → " + fmt(m.m2, caja(m.caja2).moneda); sg = '<span class="sign cb">⇄</span>'; }
  const meta = ['<span style="color:var(--ink-2);font-weight:600">'+esc(m.cat)+'</span>'];
  if (m.t === "cambio") meta.push(esc(c.nombre) + " → " + esc(caja(m.caja2).nombre));
  else if (m.caja !== "gen") meta.push(esc(c.nombre));

function listaAgrupada(movs, edit){
  if (!movs.length) return '<div class="list"><div class="empty">No hay movimientos con estos filtros.</div></div>';
  let h = '<div class="list">', cur = null;

      const g = suma(movs.filter(x => x.f === cur && esGasto(x)));

    }

}
function barraCategorias(movs){

    + '<div class="leg">' + cs.map(([c,v]) => '<div style="--k:'+kCat(c)+'"><i></i><span>'+esc(c)+'</span><span class="num">'+fmt(v,"ARS")+' · '+Math.round(v/tot*100)+'%</span></div>').join("") + '</div>';

function niceStep(x){ const p = Math.pow(10, Math.floor(Math.log10(x))); const n = x/p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }
function barPath(x, y, w, h){ const r = Math.min(4, w/2, h); return "M"+x+","+(y+h)+"V"+(y+r)+"Q"+x+","+y+" "+(x+r)+","+y+"H"+(x+w-r)+"Q"+(x+w)+","+y+" "+(x+w)+","+(y+r)+"V"+(y+h)+"Z"; }
function vistaResumen(){
  const ys = anios(); if (UI.ry === null || !ys.includes(UI.ry)) UI.ry = ys[0];
  const y = UI.ry;
  const meses = MESES.map((_,i) => { const k = y+"-"+String(i+1).padStart(2,"0"); const ms = S.movs.filter(m => m.f.slice(0,7) === k);
    return {i, ing: suma(ms.filter(esIngreso)), gas: suma(ms.filter(esGasto))}; });
  const tIng = meses.reduce((a,m)=>a+m.ing,0), tGas = meses.reduce((a,m)=>a+m.gas,0);
  let h = '<section class="sec">' + secHead("Resumen "+y, 3, "R", '<select id="ry" class="plain" aria-label="Año">'+opts(ys, y)+'</select>');
  h += '<div class="mes"><div class="tile" style="--k:var(--in)"><span class="lab">Ingresos del año</span><span class="val num">'+fmt(tIng,"ARS")+'</span></div><div class="tile" style="--k:var(--out)"><span class="lab">Gastos del año</span><span class="val num">'+fmt(tGas,"ARS")+'</span></div>'
    + '<div class="tile" style="--k:var(--c3)"><span class="lab">Diferencia</span><span class="val num">'+fmt(tIng-tGas,"ARS")+'</span></div><div class="tile" style="--k:var(--c1)"><span class="lab">En caja al cierre</span><span class="val num">'+fmt(saldos(y+"-12-31").gen,"ARS")+'</span></div></div>';
  const W = 680, H = 250, L = 64, R = 10, T = 14, B = 30, max = Math.max(1, ...meses.map(m => Math.max(m.ing, m.gas)));
  const paso = niceStep(max/4), top = Math.ceil(max/paso)*paso;
  const sy = v => T + (H-T-B) * (1 - v/top), gw = (W-L-R)/12, bw = Math.min(16, (gw-8)/2);
  let svg = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Ingresos y gastos por mes de '+y+'">';
  for (let v = 0; v <= top + 1; v += paso) svg += '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+sy(v)+'" y2="'+sy(v)+'" stroke="var(--line-2)" stroke-width="1"/><text x="'+(L-8)+'" y="'+(sy(v)+4)+'" text-anchor="end" font-size="11" fill="var(--ink-3)" font-family="IBM Plex Mono, monospace">'+(v>=1e6?(v/1e6).toLocaleString("es-AR")+" M":nf0.format(v/1000)+" k")+'</text>';
  meses.forEach((m,i) => {
    const x0 = L + gw*i + gw/2 - bw - 1;
    [[m.ing,"var(--in)",x0],[m.gas,"var(--out)",x0+bw+2]].forEach(([v,c,x]) => { if (v > 0){ const y1 = sy(v); svg += '<path d="'+barPath(x, y1, bw, sy(0)-y1)+'" fill="'+c+'"/>'; } });
    svg += '<rect x="'+(L+gw*i)+'" y="'+T+'" width="'+gw+'" height="'+(H-T-B)+'" fill="transparent" data-mes="'+i+'"/>';
    svg += '<text x="'+(L+gw*i+gw/2)+'" y="'+(H-10)+'" text-anchor="middle" font-size="11.5" fill="var(--ink-2)">'+MES3[i]+'</text>';
  });
  svg += '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+sy(0)+'" y2="'+sy(0)+'" stroke="var(--ink-3)" stroke-width="1"/></svg>';
  h += '<div class="card"><div class="sec-head"><h3 style="font-size:15px">Ingresos y gastos por mes</h3><div class="legend"><span><i style="background:var(--in)"></i>Ingresos</span><span><i style="background:var(--out)"></i>Gastos</span></div></div>'
    + '<div class="chart-box" id="chartBox">'+svg+'</div>'
    + '<details><summary style="cursor:pointer;font-size:13px;color:var(--ink-2)">Ver como tabla</summary><div class="tscroll"><table class="t"><tr><th>Mes</th><th>Ingresos</th><th>Gastos</th><th>Diferencia</th></tr>'
    + meses.map(m => '<tr><td>'+MESES[m.i]+'</td><td class="num">'+fmt(m.ing,"ARS")+'</td><td class="num">'+fmt(m.gas,"ARS")+'</td><td class="num">'+fmt(m.ing-m.gas,"ARS")+'</td></tr>').join("") + '</table></div></details></div>';
  const gastosY = S.movs.filter(m => m.f.slice(0,4) === y && esGasto(m));
  const porCat = {}; gastosY.forEach(m => porCat[m.cat] = (porCat[m.cat]||0) + m.m);
  const cs = Object.entries(porCat).sort((a,b) => b[1]-a[1]), cmax = cs.length ? cs[0][1] : 1;
  h += '<div class="card"><h3 style="font-size:15px">¿En qué se gastó en '+y+'?</h3>' + (cs.length ? cs.map(([c,v]) => '<div class="catrow" style="--k:'+kCat(c)+'"><span><i></i>'+esc(c)+'</span><span class="bar"><i style="width:'+(v/cmax*100).toFixed(1)+'%"></i></span><span class="num">'+fmt(v,"ARS")+' · '+Math.round(v/tGas*100)+'%</span></div>').join("") : '<p class="note">Sin gastos este año.</p>') + '</div>';
  h += '<div class="card"><h3 style="font-size:15px">Saldo en caja general</h3>'+lineaSaldo()+'</div></section>';
  return h;
}
function lineaSaldo(){
  const pts = []; let s = 0;
  for (const m of ordenados()){ for (const [c,v] of efectos(m)) if (c === "gen") s += v; if (pts.length && pts[pts.length-1].f === m.f) pts[pts.length-1].s = s; else pts.push({f:m.f, s}); }
  if (pts.length < 2) return '<p class="note">Todavía no hay datos suficientes.</p>';
  const W = 680, H = 190, L = 64, R = 14, T = 14, B = 26;
  const t0 = pd(pts[0].f).getTime(), t1 = pd(pts[pts.length-1].f).getTime();
  const mx = Math.max(...pts.map(p=>p.s)), mn = Math.min(0, ...pts.map(p=>p.s));
  const paso = niceStep((mx-mn)/3 || 1), top = Math.ceil(mx/paso)*paso, bot = Math.floor(mn/paso)*paso;
  const sx = f => L + (W-L-R) * (pd(f).getTime()-t0)/(t1-t0 || 1), sy = v => T + (H-T-B) * (1 - (v-bot)/(top-bot || 1));
  let svg = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Evolución del saldo en caja general">';
  for (let v = bot; v <= top + 1; v += paso) svg += '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+sy(v)+'" y2="'+sy(v)+'" stroke="var(--line-2)"/><text x="'+(L-8)+'" y="'+(sy(v)+4)+'" text-anchor="end" font-size="11" fill="var(--ink-3)" font-family="IBM Plex Mono, monospace">'+nf0.format(v/1000)+' k</text>';
  const y0 = pd(pts[0].f).getFullYear(), y1 = pd(pts[pts.length-1].f).getFullYear();
  for (let yy = y0+1; yy <= y1; yy++){ const x = sx(yy+"-01-01"); svg += '<line x1="'+x+'" x2="'+x+'" y1="'+T+'" y2="'+(H-B)+'" stroke="var(--line)" stroke-dasharray="3 3"/><text x="'+x+'" y="'+(H-8)+'" text-anchor="middle" font-size="11.5" fill="var(--ink-2)">'+yy+'</text>'; }
  let d = ""; pts.forEach((p,i) => { d += (i ? "H"+sx(p.f).toFixed(1)+"V" : "M"+sx(p.f).toFixed(1)+","); d += sy(p.s).toFixed(1); });
  const last = pts[pts.length-1];
  svg += '<path d="'+d+"V"+sy(bot)+"H"+L+'Z" fill="color-mix(in srgb, var(--c1) 16%, var(--paper))" stroke="none"/><path d="'+d+'" fill="none" stroke="var(--c1)" stroke-width="2"/>'
    + '<circle cx="'+sx(last.f)+'" cy="'+sy(last.s)+'" r="4.5" fill="var(--c1)" stroke="var(--paper)" stroke-width="2"/></svg>';
  return '<div class="chart-box">'+svg+'</div><p class="note">Cada escalón es un día con movimientos. Las subidas grandes son las ofrendas mensuales de la iglesia.</p>';
}


const ACT_K = {"Bicicleteada":5,"Bingo":4,"Beneficio":3,"Campamento":8,"Venta de comida":2,"Otra":7};
const kAct = tipo => "var(--c" + (ACT_K[tipo] ?? 1) + ")";
const ACAT_K = {"Cuotas y entradas":1,"Ventas":2,"Rifas y bingo":4,"Donaciones y ofrendas":7,"Aporte de encargados":5,"Aporte de la caja del grupo":6,"Otros ingresos":0,
  "Lugar y estadía":1,"Comida y bebida":4,"Seguro":7,"Servicios":3,"Limpieza":5,"Transporte":6,"Juegos y entretenimiento":2,"Materiales":8,"Premios":5,"Otros gastos":0};
const kAcat = c => "var(--c" + (ACAT_K[c] ?? 0) + ")";
const CAJA_APORTE = "Aporte de la caja del grupo";
function totAct(a){
  const items = a.items || [];
  const rec = items.filter(x => x.t === "in" && x.cat !== CAJA_APORTE).reduce((s,x)=>s+x.m,0);
  const aporte = items.filter(x => x.t === "in" && x.cat === CAJA_APORTE).reduce((s,x)=>s+x.m,0);
  const gas = items.filter(x => x.t === "out").reduce((s,x)=>s+x.m,0);
  return {rec, aporte, gas, bal: rec - gas, final: rec + aporte - gas};
}
const balTxt = v => '<span class="num bal '+(v >= 0 ? 'pos' : 'neg')+'">'+(v > 0 ? "+" : "")+fmt(v,"ARS")+'</span>';
const actsOrd = () => (S.acts||[]).slice().sort((a,b) => b.f.localeCompare(a.f) || a.nombre.localeCompare(b.nombre));

  Object.keys(porMes).sort().reverse().forEach(k => {

  Object.entries(tipos).filter(([,as]) => as.length > 1).forEach(([tipo, as]) => {
    as = as.slice().sort((a,b) => a.f.localeCompare(b.f));

        + '<div class="catrow" style="--k:var(--in);grid-template-columns:1fr 8.5em"><span class="bar"><i style="width:'+(x.rec/max*100).toFixed(1)+'%"></i></span><span class="num">'+fmt(x.rec,"ARS")+'</span></div>'

  });
  return h + '</section>';
}

function guardarAform(){
  leerAform();

  else { const a = {id: "a" + nuevoId().slice(1), nombre: aform.nombre.trim(), tipo: aform.tipo, f: aform.f, estado: aform.estado, items: []}; if (aform.nota.trim()) a.nota = aform.nota.trim(); S.acts.push(a); UI.act = a.id; toast("Actividad creada: " + a.nombre); }

}
function guardarIform(){
  leerIform();
  const m = num(iform.m);
  if (!(m > 0)){ iform.err = "Escribí un importe mayor que cero."; render(); return; }
  if (!iform.d.trim()){ iform.err = "Escribí el concepto."; render(); return; }
  const a = S.acts.find(x => x.id === iform.act); if (!a) return;
  const it = {id: iform.id || "i" + nuevoId().slice(1), t: iform.t, d: iform.d.trim(), cat: iform.cat, m};

      return '<div class="atj" style="--k:'+kCaja(c.id)+'"><label class="f"><span style="display:flex;align-items:center;gap:6px"><i style="width:10px;height:10px;border-radius:3px;background:var(--k);display:inline-block"></i>Nombre · '+(c.moneda === "USD" ? "dólares" : "pesos")+(c.oculta ? " · oculta" : "")+'</span><input id="cj-n-'+i+'" value="'+esc(c.nombre)+'"></label>'
        + '<label class="f">Saldo actual<input value="'+fmt(salC[c.id]||0, c.moneda)+'" disabled></label>'
        + '<label class="f">Fijar saldo en<input id="cj-s-'+i+'" inputmode="decimal" placeholder="sin cambios" autocomplete="off"></label>'
        + '<div class="actions">' + (c.id === "gen" ? '' : '<button class="btn small" data-cjhide="'+i+'">'+(c.oculta ? "Mostrar" : "Ocultar")+'</button>') + (!usada && c.id !== "gen" ? '<button class="btn small danger" data-cjdel="'+i+'">Borrar</button>' : '') + '</div></div>'; }).join("")
    + '<div class="actions"><button class="btn primary" id="cjSave">Guardar cajas</button></div>'
    + '<div class="atj" style="border-top:1px solid var(--line-2);padding-top:12px"><label class="f">Nueva caja<input id="cj-new-n" placeholder="Ej.: Plazo fijo" autocomplete="off"></label>'
    + '<label class="f">Moneda<select id="cj-new-m"><option value="ARS">Pesos</option><option value="USD">Dólares</option></select></label>'
    + '<label class="f">Saldo inicial<input id="cj-new-s" inputmode="decimal" placeholder="0" autocomplete="off"></label><button class="btn" id="cjAdd">Agregar caja</button></div></div>';
  h += '<div class="card"><h3 style="font-size:15px">Botones de carga rápida</h3><p class="note">Ajustá el importe habitual cuando cambien los precios. Igual se puede corregir al cargar.</p>'
    + S.atajos.map((a,i) => '<div class="atj"><label class="f">Nombre<input id="at-n-'+i+'" value="'+esc(a.nombre)+'"></label><label class="f">Importe<input id="at-m-'+i+'" inputmode="decimal" value="'+a.m+'"></label>'
      + '<label class="f">Categoría<select id="at-c-'+i+'">'+opts(a.t==="in"?S.cats.in:S.cats.out, a.cat)+'</select></label><button class="btn small danger" data-atdel="'+i+'">Quitar</button></div>').join("")
    + '<div class="actions"><button class="btn" id="atSave">Guardar botones</button><button class="btn" data-atadd="out">+ Botón de gasto</button><button class="btn" data-atadd="in">+ Botón de ingreso</button></div></div>';
  h += '<div class="card"><h3 style="font-size:15px">Correcciones al importar la planilla</h3><p class="note">Al pasar la planilla original se corrigieron fechas mal escritas y se agregaron 2 ajustes donde el saldo anotado no coincidía con la suma. Están marcados con una nota; buscá “Fecha corregida” o “Ajuste” en Movimientos.</p></div>';
  return h + '</section>';
}
async function cargarCopias(){
  try { const q = await COPIAS.orderBy(firebase.firestore.FieldPath.documentId(), "desc").limit(20).get(); copias = q.docs.map(d => ({id:d.id, movs:d.data().movs})); }
  catch(e){ copias = []; }
  if (UI.tab === "copias") render();
}

function vistaSinDatos(){
  if (errorLectura) return '<div class="card"><h2>No se pudo leer el libro</h2><p class="note">Firebase respondió: '+esc(errorLectura)+'. Si recién se creó la página, falta agregar las reglas de Firestore para Tesorería PRE.</p></div>';
  if (!cargado) return '<div class="loading">Cargando el libro de caja…</div>';
  if (canWrite) return '<div class="card"><h2>El libro todavía está vacío</h2><p class="note">Esta página trae los '+SEED.movs.length+' movimientos de la planilla Tesoreria.xlsx, con las fechas corregidas. Subilos para empezar.</p><div class="actions"><button class="btn primary" id="importar">Subir los movimientos de la planilla</button></div></div>';
  return '<div class="card"><h2>Todavía no hay datos publicados</h2><p class="note">El tesorero todavía no cargó el libro de caja. Volvé a entrar en un rato.</p></div>';
}

function render(){
  const y = window.scrollY;
  let body;
  if (!S) body = vistaSinDatos();
  else if (UI.tab === "inicio") body = vistaInicio();
  else if (UI.tab === "movs") body = vistaMovs();
  else if (UI.tab === "resumen") body = vistaResumen();
  else if (UI.tab === "acts") body = vistaActividades();
  else body = vistaCopias();
  $root.innerHTML = header() + '<main class="gut">' + body + '</main>';
  window.scrollTo(0, y);
  if (form && form.focus){ const m = document.getElementById("f-m"); if (m){ m.focus(); m.select(); } form.focus = false; }
}

/* ---------- formulario ---------- */
function leerForm(){
  if (!form) return;
  ["m","f","d","caja","caja2","m2","cat","quien","ev","nota"].forEach(k => { const el = document.getElementById("f-"+k); if (el) form[k] = el.value; });
}
function num(s){ if (typeof s === "number") return s; s = String(s||"").trim().replace(/\s|\$|US/g,""); if (/,\d{1,2}$/.test(s)) s = s.replace(/\./g,"").replace(",","."); else s = s.replace(/[.,](?=\d{3}(\D|$))/g,""); return parseFloat(s); }
function abrirForm(datos){ form = Object.assign({t:"out", f:hoy(), d:"", caja:"gen", caja2:"usd", cat:S.cats.out[0], focus:true}, datos); confirmDel = null; render(); }
function guardarForm(){
  leerForm();
  const m = num(form.m);
  if (form.t !== "ajuste" && !(m > 0)){ form.err = "Escribí un importe mayor que cero."; render(); return; }
  if (form.t === "ajuste" && !isFinite(m)){ form.err = "Escribí un importe."; render(); return; }
  if (!form.f){ form.err = "Elegí una fecha."; render(); return; }
  if (!form.d.trim()){ form.err = "Escribí una descripción."; render(); return; }
  const mov = {id: form.id || nuevoId(), f: form.f, d: form.d.trim(), t: form.t, m, caja: form.caja};
  if (form.t === "cambio"){
    const m2 = num(form.m2);
    if (form.caja === form.caja2){ form.err = "Elegí dos cajas distintas."; render(); return; }
    if (!(m2 > 0)){ form.err = "Escribí el importe que entra."; render(); return; }
    Object.assign(mov, {caja2: form.caja2, m2, cat: "Cambio de moneda"});
  } else {
    mov.cat = form.cat;
    if (form.quien && form.quien.trim()) mov.quien = form.quien.trim();
    if (form.ev && form.ev.trim()) mov.ev = form.ev.trim();
  }
  if (form.nota && form.nota.trim()) mov.nota = form.nota.trim();
  const i = S.movs.findIndex(x => x.id === mov.id);
  if (i >= 0) S.movs[i] = mov; else S.movs.push(mov);
  toast((i < 0 ? "Agregado: " : "Actualizado: ") + mov.d);
  form = null;
  cambio();
}
function leerAtajos(){ S.atajos.forEach((a,i) => { const n = document.getElementById("at-n-"+i), m = document.getElementById("at-m-"+i), c = document.getElementById("at-c-"+i); if (n) a.nombre = n.value.trim() || a.nombre; if (m){ const v = num(m.value); if (v >= 0) a.m = v; } if (c) a.cat = c.value; a.d = a.nombre; }); }

/* ---------- eventos ---------- */
$root.addEventListener("click", async e => {
  const t = e.target.closest("button, .row.edit, .irow.edit");
  if (!t) return;
  if (t.id === "entrar"){ try { await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); } catch(err){ if (err && err.code === "auth/popup-blocked") auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider()); else if (err && err.code !== "auth/popup-closed-by-user" && err.code !== "auth/cancelled-popup-request") toast("No se pudo entrar: " + (err.message || err.code)); } return; }
  if (t.id === "salir"){ auth.signOut(); return; }
  if (t.id === "importar"){ S = JSON.parse(JSON.stringify(SEED)); toast("Subiendo los movimientos…"); cambio(); return; }
  if (!S) return;
  if (t.dataset.tab){ UI.tab = t.dataset.tab; form = null; aform = null; iform = null; if (t.dataset.tab === "acts") UI.act = null; guardarUI(); render(); window.scrollTo(0,0); return; }
  if (t.id === "actImport"){ S.acts = JSON.parse(JSON.stringify(SEED.acts)); S.catsAct = SEED.catsAct; S.tiposAct = SEED.tiposAct; toast("Actividades agregadas"); cambio(); return; }
  if (t.id === "actEmpty"){ S.acts = []; S.catsAct = SEED.catsAct; S.tiposAct = SEED.tiposAct; cambio(); return; }
  if (t.dataset.act){ UI.act = t.dataset.act; aform = null; iform = null; confirmAct = null; guardarUI(); render(); window.scrollTo(0,0); return; }
  if (t.id === "actBack"){ UI.act = null; aform = null; iform = null; confirmAct = null; guardarUI(); render(); window.scrollTo(0,0); return; }
  if (t.id === "actNew"){ aform = {nombre:"", tipo:S.tiposAct[0], f:hoy(), estado:"curso", nota:""}; render(); const el = document.getElementById("a-nombre"); if (el) el.focus(); return; }
  if (t.id === "actEdit"){ const a = S.acts.find(x => x.id === UI.act); aform = Object.assign({}, a); render(); return; }
  if (t.id === "aCancel"){ aform = null; render(); return; }
  if (t.id === "actDel"){ confirmAct = UI.act; render(); return; }
  if (t.id === "actDelNo"){ confirmAct = null; render(); return; }
  if (t.id === "actDelSi"){ const a = S.acts.find(x => x.id === confirmAct); S.acts = S.acts.filter(x => x.id !== confirmAct); confirmAct = null; UI.act = null; guardarUI(); toast("Borrada: " + (a ? a.nombre : "actividad")); cambio(); return; }
  if (t.dataset.inew){ const tt = t.dataset.inew; iform = {act: UI.act, t: tt, d:"", cat: tt === "in" ? S.catsAct.in[0] : S.catsAct.out[0], m:""}; render(); const el = document.getElementById("i-m"); if (el) el.focus(); return; }
  if (t.dataset.iedit && canWrite){ const a = S.acts.find(x => x.id === UI.act); const it = a && a.items.find(x => x.id === t.dataset.iedit); if (it){ iform = Object.assign({act: a.id}, it); render(); window.scrollTo(0,0); } return; }
  if (t.dataset.itipo && iform){ leerIform(); if (iform.t !== t.dataset.itipo){ iform.t = t.dataset.itipo; iform.cat = iform.t === "in" ? S.catsAct.in[0] : S.catsAct.out[0]; } render(); return; }
  if (t.id === "iCancel"){ iform = null; render(); return; }
  if (t.id === "iDel"){ leerIform(); iform.confirm = true; render(); return; }
  if (t.id === "iDelNo"){ iform.confirm = false; render(); return; }
  if (t.id === "iDelSi"){ const a = S.acts.find(x => x.id === iform.act); a.items = a.items.filter(x => x.id !== iform.id); toast("Borrado: " + iform.d); iform = null; cambio(); return; }
  if (t.id === "dlActs") return descargarActs();
  if (t.id === "goCajas"){ UI.tab = "copias"; form = null; guardarUI(); render(); const el = document.getElementById("cajasPanel"); if (el) el.scrollIntoView({block:"start"}); return; }
  if (t.id === "cjSave"){
    const sal = saldos(); let n = 0;
    S.cajas.forEach((c,i) => {
      const ne = document.getElementById("cj-n-"+i), se = document.getElementById("cj-s-"+i);
      if (ne && ne.value.trim()) c.nombre = ne.value.trim();
      if (se && se.value.trim() !== ""){ const v = num(se.value); if (isFinite(v)){ const diff = Math.round((v - (sal[c.id]||0))*100)/100;
        if (diff){ S.movs.push({id: nuevoId(), f: hoy(), d: "Ajuste de saldo: " + c.nombre, t: "ajuste", m: diff, caja: c.id, cat: "Ajuste", nota: "Saldo fijado en " + fmt(v, c.moneda)}); n++; } } }
    });
    toast(n ? "Cajas guardadas · " + n + (n === 1 ? " ajuste registrado" : " ajustes registrados") : "Cajas guardadas"); cambio(); return; }
  if (t.dataset.cjhide){ const c = S.cajas[+t.dataset.cjhide]; c.oculta = !c.oculta; toast((c.oculta ? "Oculta: " : "Visible: ") + c.nombre); cambio(); return; }
  if (t.dataset.cjdel){ const c = S.cajas.splice(+t.dataset.cjdel, 1)[0]; toast("Borrada: " + c.nombre); cambio(); return; }
  if (t.id === "cjAdd"){
    const nombre = (document.getElementById("cj-new-n").value || "").trim(), moneda = document.getElementById("cj-new-m").value, s = num(document.getElementById("cj-new-s").value);
    if (!nombre){ toast("Escribí el nombre de la caja nueva"); return; }
    const c = {id: "c" + nuevoId().slice(1), nombre, moneda}; S.cajas.push(c);
    if (s) S.movs.push({id: nuevoId(), f: hoy(), d: "Saldo inicial: " + nombre, t: "ajuste", m: s, caja: c.id, cat: "Saldo inicial"});
    toast("Caja agregada: " + nombre); cambio(); return; }
  if (t.dataset.atajo){ const a = S.atajos[+t.dataset.atajo]; abrirForm({t:a.t, d:a.d || a.nombre, cat:a.cat, m:a.m}); return; }
  if (t.dataset.nuevo){ abrirForm({t:t.dataset.nuevo, cat: t.dataset.nuevo === "in" ? S.cats.in[0] : S.cats.out[0]}); return; }
  if (t.dataset.edit && canWrite){ const m = S.movs.find(x => x.id === t.dataset.edit); if (m){ if (UI.tab !== "inicio") UI.tab = "movs"; abrirForm(Object.assign({}, m, {focus:false})); window.scrollTo(0,0); } return; }
  if (t.dataset.tipo && form){ leerForm(); const nt = t.dataset.tipo; if (nt !== form.t){ form.t = nt; form.cat = nt === "in" ? S.cats.in[0] : nt === "out" ? S.cats.out[0] : "Cambio de moneda"; if (nt === "cambio"){ form.caja = "gen"; form.caja2 = "usd"; } } render(); return; }
  if (t.dataset.fecha && form){ leerForm(); form.f = t.dataset.fecha; render(); return; }
  if (t.id === "fCancel"){ form = null; confirmDel = null; render(); return; }
  if (t.id === "fDel"){ leerForm(); confirmDel = form.id; render(); return; }
  if (t.id === "delNo"){ confirmDel = null; render(); return; }
  if (t.id === "delSi"){ const d = form.d; S.movs = S.movs.filter(x => x.id !== confirmDel); confirmDel = null; form = null; toast("Borrado: " + d); cambio(); return; }
  if (t.id === "dlCsv") return descargarCsv();
  if (t.id === "dlJson") return bajar("Tesoreria-PRE-copia-" + hoy() + ".json", JSON.stringify(S, null, 1), "application/json");
  if (t.id === "restNo"){ restoreText = null; render(); return; }
  if (t.id === "restSi"){ S = Object.assign({}, restoreText, {rev: S.rev}); restoreText = null; toast("Copia restaurada"); cambio(); return; }
  if (t.dataset.copia){ confirmCopia = t.dataset.copia; render(); return; }
  if (t.dataset.copiano){ confirmCopia = null; render(); return; }
  if (t.dataset.copiasi){ try { const d = await COPIAS.doc(t.dataset.copiasi).get(); const libro = JSON.parse(d.data().libro); S = Object.assign(libro, {rev: S.rev}); confirmCopia = null; toast("Volviste a la copia del " + fCorta(t.dataset.copiasi)); cambio(); } catch(err){ toast("No se pudo leer esa copia"); } return; }
  if (t.id === "atSave"){ leerAtajos(); toast("Botones actualizados"); cambio(); return; }
  if (t.dataset.atdel){ leerAtajos(); S.atajos.splice(+t.dataset.atdel, 1); cambio(); return; }
  if (t.dataset.atadd){ leerAtajos(); const tt = t.dataset.atadd; S.atajos.push({nombre: tt === "in" ? "Nuevo ingreso" : "Nuevo gasto", t: tt, cat: tt === "in" ? S.cats.in[0] : S.cats.out[0], m: 0}); render(); return; }
});
$root.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.matches(".row.edit, .irow.edit")){ e.preventDefault(); e.target.click(); } });
$root.addEventListener("submit", e => { e.preventDefault(); if (e.target.id === "mform") guardarForm(); else if (e.target.id === "aform") guardarAform(); else if (e.target.id === "iform") guardarIform(); });
$root.addEventListener("change", e => {
  const id = e.target.id;
  if (["fy","fm","fc","fcaja"].includes(id)){ UI[id] = e.target.value; guardarUI(); render(); return; }
  if (id === "ry"){ UI.ry = e.target.value; guardarUI(); render(); return; }
  if (id === "ay"){ UI.ay = e.target.value; guardarUI(); render(); return; }
  if (id === "a-tipo" && aform){ leerAform(); return; }
  if ((id === "f-caja" || id === "f-caja2") && form){ leerForm(); render(); return; }
  if (id === "restFile"){ const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { try { const d = JSON.parse(r.result); if (!d || !Array.isArray(d.movs) || !Array.isArray(d.cajas)) throw 0; restoreText = d; } catch(x){ restoreText = null; toast("Ese archivo no es una copia de Tesorería PRE"); } render(); }; r.readAsText(f); }
});
let qT = null;
$root.addEventListener("input", e => { if (e.target.id === "fq"){ UI.q = e.target.value; clearTimeout(qT); qT = setTimeout(() => { const pos = e.target.selectionStart; render(); const el = document.getElementById("fq"); if (el){ el.focus(); try { el.setSelectionRange(pos,pos); } catch(x){} } }, 220); } });
$root.addEventListener("pointermove", e => {
  const r = e.target.closest && e.target.closest("[data-mes]"); const box = document.getElementById("chartBox");
  let tip = document.getElementById("tip");
  if (!r || !box){ if (tip) tip.remove(); return; }
  const i = +r.dataset.mes, y = UI.ry, k = y+"-"+String(i+1).padStart(2,"0");

  if (!tip){ tip = document.createElement("div"); tip.id = "tip"; tip.className = "tip"; box.appendChild(tip); }
  tip.innerHTML = '<b>'+MESES[i]+' '+y+'</b><br>Ingresos <span class="num">'+fmt(suma(ms.filter(esIngreso)),"ARS")+'</span><br>Gastos <span class="num">'+fmt(suma(ms.filter(esGasto)),"ARS")+'</span>';
  const bb = box.getBoundingClientRect(), rb = r.getBoundingClientRect();
  tip.style.left = Math.max(80, Math.min(bb.width - 80, rb.left - bb.left + box.scrollLeft + rb.width/2)) + "px"; tip.style.top = (e.clientY - bb.top) + "px";
});

/* ---------- descargas ---------- */
function bajar(nombre, data, tipo){
  const url = URL.createObjectURL(new Blob([data], {type: tipo}));
  const a = document.createElement("a"); a.href = url; a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function descargarActs(){
  const q = s => '"' + String(s ?? "").replace(/"/g,'""') + '"';
  const n = v => String(v).replace(".", ",");
  const lines = [["Actividad","Tipo","Fecha","Estado","Movimiento","Rubro","Concepto","Importe","Nota"].map(q).join(";")];
  for (const a of actsOrd().reverse()) for (const i of a.items)
    lines.push([q(a.nombre),q(a.tipo),q(a.f.split("-").reverse().join("/")),q(a.estado === "curso" ? "En curso" : "Cerrada"),q(i.t === "in" ? "Ingreso" : "Gasto"),q(i.cat),q(i.d),n(i.t === "in" ? i.m : -i.m),q(i.nota)].join(";"));
  bajar("Tesoreria-PRE-actividades-" + hoy() + ".csv", "\ufeff" + lines.join("\r\n"), "text/csv;charset=utf-8");
}
function descargarCsv(){
  const q = s => '"' + String(s ?? "").replace(/"/g,'""') + '"';
  const n = v => v === "" ? "" : String(v).replace(".", ",");
  const lines = [["Fecha","Tipo","Descripción","Categoría","Caja","Moneda","Ingreso","Egreso","Quién","Evento","Nota"].map(q).join(";")];
  const T = {in:"Ingreso", out:"Gasto", ajuste:"Ajuste", cambio:"Cambio de moneda"};
  for (const m of ordenados()){
    const fe = m.f.split("-").reverse().join("/");
    if (m.t === "cambio"){
      lines.push([q(fe),q(T.cambio),q(m.d),q(m.cat),q(caja(m.caja).nombre),q(caja(m.caja).moneda),"",n(m.m),"","",q(m.nota)].join(";"));
      lines.push([q(fe),q(T.cambio),q(m.d),q(m.cat),q(caja(m.caja2).nombre),q(caja(m.caja2).moneda),n(m.m2),"","","",q(m.nota)].join(";"));
    } else {
      const ing = m.t === "in" || (m.t === "ajuste" && m.m >= 0) ? Math.abs(m.m) : "", eg = m.t === "out" || (m.t === "ajuste" && m.m < 0) ? Math.abs(m.m) : "";
      lines.push([q(fe),q(T[m.t]),q(m.d),q(m.cat),q(caja(m.caja).nombre),q(caja(m.caja).moneda),n(ing),n(eg),q(m.quien),q(m.ev),q(m.nota)].join(";"));
    }
  }
  bajar("Tesoreria-PRE-" + hoy() + ".csv", "﻿" + lines.join("\r\n"), "text/csv;charset=utf-8");
}

/* ---------- arranque ---------- */
auth.onAuthStateChanged(u => {
  usuario = u;
  canWrite = !!(u && u.email && u.email.toLowerCase() === TESORERO);
  if (u && !canWrite) toast("Entraste con " + u.email + ": esa cuenta solo puede ver.");
  form = null; render();
});
LIBRO.onSnapshot(snap => {
  errorLectura = null; cargado = true;
  if (!snap.exists){ existe = false; S = null; render(); return; }
  existe = true;
  if (snap.metadata.hasPendingWrites || saveState === "dirty" || saveState === "saving") return; // mis propios cambios en camino
  const d = snap.data();
  if (S && (d.rev||0) <= (S.rev||0) && canWrite) return;
  leerForm();
  S = {rev: d.rev||0, cajas: d.cajas, cats: d.cats, atajos: d.atajos, movs: d.movs, acts: d.acts || null, catsAct: d.catsAct || SEED.catsAct, tiposAct: d.tiposAct || SEED.tiposAct};
  render();
}, err => { errorLectura = err.code || err.message; cargado = true; render(); });
render();
})();
